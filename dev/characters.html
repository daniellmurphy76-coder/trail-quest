<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Trail Quest character comparison</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 15px;
        color: #1f2a1f;
        background: #fffdf7;
      }
      .layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: 100%;
      }
      aside {
        overflow-y: auto;
        padding: 12px 14px 24px;
        background: #f1ebdd;
        border-right: 4px solid #1f2a1f;
      }
      aside h1 {
        margin: 0 0 4px;
        font-size: 1.15em;
      }
      aside h2 {
        margin: 18px 0 6px;
        padding-top: 10px;
        border-top: 2px solid #1f2a1f;
        font-size: 1.05em;
      }
      aside p {
        margin: 4px 0;
      }
      .note {
        color: #4a5a4a;
        font-size: 0.9em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin: 6px 0;
      }
      button,
      select {
        font: inherit;
        padding: 5px 9px;
        border: 2px solid #1f2a1f;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #2f6b3a;
        color: #fff;
      }
      .clips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 6px 0;
      }
      .clips button {
        padding: 3px 7px;
        font-size: 0.85em;
      }
      .clips button.role {
        border-color: #b8860b;
        box-shadow: inset 0 0 0 2px #f2c230;
      }
      .legend {
        font-size: 0.85em;
        color: #4a5a4a;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #now {
        font-weight: bold;
      }
      main {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #cfe6f7;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .tag {
        position: absolute;
        transform: translate(-50%, 0);
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(255, 253, 247, 0.9);
        border: 2px solid #1f2a1f;
        font-size: 0.9em;
        white-space: nowrap;
      }
      #status {
        position: absolute;
        left: 12px;
        bottom: 10px;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(255, 253, 247, 0.9);
        font-size: 0.85em;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: 46vh 1fr;
        }
        aside {
          grid-row: 2;
          border-right: 0;
          border-top: 4px solid #1f2a1f;
        }
        main {
          grid-row: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside id="panel" aria-label="Controls"></aside>
      <main>
        <canvas id="stage" aria-label="Characters on a grass disc"></canvas>
        <div id="tags"></div>
        <div id="status" role="status">Loading...</div>
      </main>
    </div>
    <script type="module" src="/src/dev/characters-harness.ts"></script>
  </body>
</html>
