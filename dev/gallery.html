<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Trail Quest character gallery</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #1f2a1f;
        background: #e4dcc6;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The grid only lays out the cells; the canvas behind it draws into each .view. */
      #grid {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding: 30px 8px 8px;
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(var(--rows, 3), minmax(0, 1fr));
        gap: 8px;
        pointer-events: none;
      }
      .cell {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border: 1px solid #cdc3a8;
      }
      .view {
        flex: 1 1 auto;
        min-height: 0;
      }
      .label {
        flex: 0 0 36px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
        overflow: hidden;
        background: #f6f1e3;
        font-size: 15px;
        line-height: 18px;
        text-align: center;
        color: #1f2a1f;
      }
      .label.failed {
        color: #7a1f1f;
      }
      #note {
        position: fixed;
        top: 6px;
        left: 10px;
        font-size: 13px;
        line-height: 18px;
        color: #3a3f33;
        white-space: nowrap;
      }
      #note a {
        color: #1c5fa8;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Character gallery"></canvas>
    <div id="grid"></div>
    <div id="note" role="status">Loading...</div>
    <script type="module" src="/src/dev/gallery.ts"></script>
  </body>
</html>
