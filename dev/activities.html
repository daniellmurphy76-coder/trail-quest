<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Trail Quest activity harness</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 20px;
        color: #1f2a1f;
        background: #fffdf7;
      }
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100%;
      }
      nav {
        overflow-y: auto;
        padding: 16px;
        background: #f1ebdd;
        border-right: 4px solid #1f2a1f;
      }
      nav h1 {
        margin: 0 0 8px;
        font-size: 1.1em;
      }
      nav h2 {
        margin: 20px 0 8px;
        font-size: 1em;
      }
      nav .tq-btn {
        display: flex;
        width: 100%;
        margin-bottom: 10px;
        justify-content: flex-start;
        text-align: left;
      }
      nav .tq-btn[aria-current='true'] {
        background: #2f6b3a;
        color: #fff;
      }
      nav label {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }
      nav input[type='checkbox'] {
        width: 28px;
        height: 28px;
      }
      main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 360px;
        overflow: hidden;
        background: #87ceeb; /* stands in for the 3D world behind the overlay */
      }
      #ui {
        position: absolute;
        inset: 0;
      }
      #result-wrap {
        flex: 0 0 auto;
        max-height: 34%;
        overflow: auto;
        padding: 12px 16px;
        border-top: 4px solid #1f2a1f;
      }
      #result-wrap h2 {
        margin: 0 0 6px;
        font-size: 1em;
      }
      #result {
        margin: 0;
        font-size: 0.9em;
        white-space: pre-wrap;
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        nav {
          max-height: 38vh;
          border-right: 0;
          border-bottom: 4px solid #1f2a1f;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav aria-label="Sample activities" id="list"></nav>
      <main>
        <div id="stage"><div id="ui"></div></div>
        <section id="result-wrap" aria-live="polite">
          <h2>Result</h2>
          <pre id="result">Pick a sample on the left.</pre>
        </section>
      </main>
    </div>
    <script type="module" src="/src/dev/activities-harness.ts"></script>
  </body>
</html>
